apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cert-manager
spec:
  generators:
    - list:
        elements:
          - cluster: in-cluster
            namePrefix: management
            project: management
          - cluster: arogyam-example-site
            namePrefix: arogyam-example-site
            project: arogyam-production
  template:
    metadata:
      name: '{{namePrefix}}-cert-manager'
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: '{{project}}'
      sources:
        - chart: cert-manager
          repoURL: https://charts.jetstack.io
          targetRevision: v1.15.2
          helm:
            releaseName: cert-manager
            parameters:
              - name: "installCRDs"
                value: "true"
        - path: 'components/certificates_issuer'
          repoURL: 'git@github.com:YOUR_ORG/aarogya-aarohan-dpg-infra.git'
          targetRevision: HEAD
      destination:
        name: '{{cluster}}'
        namespace: cert-manager
      syncPolicy:
        automated:
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - CreateNamespace=true
          - Validate=true