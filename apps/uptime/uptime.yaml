apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: uptime
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: management
  sources:
    - chart: uptime-kuma
      repoURL: https://dirsigler.github.io/uptime-kuma-helm
      targetRevision: 2.20.0
      helm:
        releaseName: uptime-kuma
        valueFiles:
          - '$values/values/uptime/values.yaml'
    - repoURL: 'git@github.com:YOUR_ORG/aarogya-aarohan-dpg-infra.git'
      targetRevision: main
      ref: values
  destination:
    name: in-cluster
    namespace: uptime
  syncPolicy:
    automated:
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - Validate=true