apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-arogyam-staging
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: aa-stg
  destination:
    name: staging
    namespace: arogyam
  source:
    repoURL: git@github.com:YOUR_ORG/aarogya-aarohan-dpg-infra.git
    targetRevision: main
    path: managed-cloud/components/external-secrets/external-secrets/overlays/staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
