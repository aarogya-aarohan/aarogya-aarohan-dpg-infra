apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak-production
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: aa-prod
  destination:
    name: production
    namespace: arogyam
  sources:
    - repoURL: registry-1.docker.io/bitnamicharts
      chart: keycloak
      targetRevision: 21.0.0
      helm:
        releaseName: keycloak
        valueFiles:
          - $values/managed-cloud/components/keycloak/values-base.yaml
          - $values/managed-cloud/components/keycloak/values-production.yaml
    - repoURL: git@github.com:YOUR_ORG/aarogya-aarohan-dpg-infra.git
      targetRevision: main
      ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
