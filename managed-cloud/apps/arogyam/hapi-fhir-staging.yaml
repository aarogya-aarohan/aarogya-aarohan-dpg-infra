apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hapi-fhir-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: aa-stg
  destination:
    name: staging
    namespace: arogyam
  source:
    repoURL: git@github.com:YOUR_ORG/aarogya-aarohan-dpg-infra.git
    targetRevision: main
    path: managed-cloud/components/hapi-fhir/overlays/staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
