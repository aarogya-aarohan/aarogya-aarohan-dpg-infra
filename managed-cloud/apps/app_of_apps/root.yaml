apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-of-apps
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:YOUR_ORG/aarogya-aarohan-dpg-infra.git
    path: managed-cloud/apps
    targetRevision: main
    directory:
      recurse: true
      exclude: app_of_apps/**
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
