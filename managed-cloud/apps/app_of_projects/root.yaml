apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-of-projects
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - path: managed-cloud/projects
      repoURL: 'git@github.com:YOUR_ORG/aarogya-aarohan-dpg-infra.git'
      targetRevision: main
    - path: managed-cloud/repositories
      repoURL: 'git@github.com:YOUR_ORG/aarogya-aarohan-dpg-infra.git'
      targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - Validate=true
