apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  destination:
    name: staging
    namespace: ingress-nginx
  sources:
    - repoURL: https://kubernetes.github.io/ingress-nginx
      chart: ingress-nginx
      targetRevision: 4.8.3
      helm:
        releaseName: ingress-nginx
        valueFiles:
          - $values/managed-cloud/components/ingress-nginx/values-base.yaml
          - $values/managed-cloud/components/ingress-nginx/values-staging.yaml
    - repoURL: git@github.com:YOUR_ORG/aarogya-aarohan-dpg-infra.git
      targetRevision: main
      ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
