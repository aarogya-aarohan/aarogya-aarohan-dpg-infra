apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-staging
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  destination:
    name: staging
    namespace: external-secrets
  source:
    repoURL: git@github.com:YOUR_ORG/aarogya-aarohan-dpg-infra.git
    targetRevision: main
    path: managed-cloud/components/external-secrets/cluster-secret-store/overlays/staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
