apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: ArgoCD-internal apps (ingress-nginx, ESO CRs, app-of-apps wiring)
  sourceRepos:
    - git@github.com:YOUR_ORG/aarogya-aarohan-dpg-infra.git
    - https://charts.external-secrets.io
    - https://kubernetes.github.io/ingress-nginx
  destinations:
    - server: '*'
      namespace: argocd
    - server: '*'
      namespace: ingress-nginx
    - server: '*'
      namespace: external-secrets
    # Addon-managed namespaces for Google Managed Prometheus (see
    # components/gmp/ and docs/monitoring.md). Both are created by the
    # GKE GMP addon itself, not by ArgoCD (no CreateNamespace=true on
    # apps/platform/gmp-staging.yaml) — these entries only grant the
    # gmp-staging Application permission to sync namespaced resources
    # (PodMonitoring, OperatorConfig) into namespaces that already exist.
    - server: '*'
      namespace: gmp-public
    - server: '*'
      namespace: gmp-system
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: external-secrets.io
      kind: ClusterSecretStore
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: networking.k8s.io
      kind: IngressClass
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
