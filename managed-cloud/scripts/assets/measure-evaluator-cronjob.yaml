# Template for the per-tenant measure-evaluator CronJob.
#
# NOT a manifest — scripts/gen-evaluator-cronjobs.sh substitutes the __PLACEHOLDER__
# tokens once per tenant and writes the result to
# components/measure-evaluator/overlays/<env>/cronjobs-generated.yaml.
# Edit this file, then regenerate both envs; editing the generated file directly
# is pointless because the next regeneration overwrites it.
#
# Placeholders substituted by the generator: __TENANT__ __SCHEDULE__
#   __DEADLINE__ __SERVER_NAME__ __SECRETS_ID__ __SUSPEND__
apiVersion: batch/v1
kind: CronJob
metadata:
  name: measure-evaluator-__TENANT__
  namespace: arogyam
  labels:
    app.kubernetes.io/name: measure-evaluator
    arogyam.tenant: __TENANT__
spec:
  # Staggered per tenant rather than everything at 02:00. A run is now a handful
  # of bulk FHIR searches rather than $evaluate-measure, so the cost to HAPI is
  # small — but it is still HAPI doing the work, and firing the whole roster at
  # one instant is a self-inflicted thundering herd for no gain. The gap only has
  # to exceed a run, not a CQL evaluation, hence minutes rather than hours.
  schedule: "__SCHEDULE__"
  # Set per environment by the generator's --suspend flag. Lives here rather than
  # in a kubectl patch because the Application syncs with selfHeal and would
  # revert a live edit — the brake on a staged rollout has to be in the manifest.
  suspend: __SUSPEND__
  # Per tenant, so a long-running evaluation is only ever skipped for its own
  # tenant, never for the rest of the roster.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      # Bounds THIS tenant only, so a stuck tenant is never charged to the rest of
      # the roster. Measured on staging AFTER the move off $evaluate-measure: the
      # full 7-measure suite is ~3.1s for 477 patients, ~167x faster than the CQL
      # path it replaced. The default is three orders of magnitude above that on
      # purpose — it is a hang detector, not a performance budget, and sizing it
      # close to the measurement would only turn a slow night into a failed one.
      activeDeadlineSeconds: __DEADLINE__
      template:
        metadata:
          labels:
            app.kubernetes.io/name: measure-evaluator
            arogyam.tenant: __TENANT__
        spec:
          # The gateway's service account: TenantRegistry reads the tenant
          # roster from GCS via Workload Identity, and the evaluator's own SA has
          # no such binding.
          serviceAccountName: fhir-gateway
          restartPolicy: Never
          containers:
            - name: measure-evaluator
              # Built from arogyam-backend's `job` Docker target — same bundle as
              # the gateway, different entrypoint (CMD measure-evaluator.js).
              # A separate image so a batch job cannot force a release of the live
              # clinical gateway, and so the two pin independently. Tag is set per
              # overlay via `images:`.
              image: iisc/arogyam-measure-evaluator
              imagePullPolicy: IfNotPresent
              envFrom:
                # Shared, non-per-env backend config (MULTI_TENANT_CONFIG_BUCKET
                # /OBJECT, MULTI_TENANT_SECRETS_FILE, GCP_PROJECT_ID, ...).
                - configMapRef:
                    name: fhir-gateway-config
              env:
                # The evaluator boots CoreModule, so Joi validates the gateway's
                # full config schema. These are the per-env values that live
                # inline in the gateway Deployment's overlay patch rather than in
                # fhir-gateway-config, so they are duplicated here rather than
                # extracted: the gateway defines some of these keys in BOTH its
                # inline env and fhir-gateway-config, where inline wins, and
                # re-plumbing that precedence on a live clinical service to suit
                # a batch job is not a safe trade. The FHIR_* values below are
                # inert placeholders in every environment — they satisfy Joi's
                # presence check and are never used by a measure run.
                - name: SERVER_NAME
                  value: __SERVER_NAME__
                - name: MULTI_TENANT_SECRETS_ID
                  value: __SECRETS_ID__
                - name: FHIR_BASE_URL
                  value: http://hapi-fhir.arogyam.svc.cluster.local/fhir
                - name: FHIR_TOKEN_URL
                  value: unused-by-measure-evaluator
                - name: FHIR_CLIENT_ID
                  value: unused-by-measure-evaluator
                - name: FHIR_CLIENT_SECRET
                  value: unused-by-measure-evaluator
                - name: EXPORT_ENABLED
                  value: "false"
                # This pod's tenant. One CronJob per tenant, so it is fixed here
                # rather than looped over at runtime. The tenant roster itself
                # comes from TenantRegistry (GCS), which is authoritative.
                - name: ONLY_TENANT
                  value: __TENANT__
                - name: MEASURES
                  value: >-
                    registration-count,
                    registration-count:7,
                    ai-prediction-count,
                    ai-override-count,
                    dentist-review-count,
                    specialist-review-count,
                    referred-to-dentist-count,
                    high-risk-count
              volumeMounts:
                - name: tenant-credentials
                  mountPath: /etc/arogyam
                  readOnly: true
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
          volumes:
            - name: tenant-credentials
              secret:
                # ESO-synced from Secret Manager aa-<env>-arogyam-tenant-credentials.
                secretName: arogyam-tenant-credentials
                optional: true
                items:
                  - key: tenant-credentials.json
                    path: tenant-credentials.json
