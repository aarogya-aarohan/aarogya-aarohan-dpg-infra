# arogyam-backend (FHIR Integration Gateway). Replaces the previous URL-prefix
# routing gateway: this app loads tenant config from a public GCS object and a
# bundled GCP Secret Manager secret, both fetched on startup and on POST
# /admin/tenants/reload. Per-tenant credentials are no longer one SM secret per
# tenant — they live in a single bundled secret keyed by tenant code, mounted
# here as /etc/arogyam/tenant-credentials.json (synced by the
# arogyam-tenant-credentials ExternalSecret).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fhir-gateway
  namespace: arogyam
  labels:
    app.kubernetes.io/name: fhir-gateway
    # Shared with fhir-gateway-cron: the Service selects pods on part-of, and
    # the overlay env patch targets Deployments on part-of. The selector below
    # stays name-only (Deployment selectors are immutable on an existing object).
    app.kubernetes.io/part-of: fhir-gateway
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: fhir-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fhir-gateway
        app.kubernetes.io/part-of: fhir-gateway
    spec:
      serviceAccountName: fhir-gateway
      containers:
        - name: fhir-gateway
          image: iisc/arogyam-fhir-gateway:v0.2.49
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: fhir-gateway-config
          env:
            # Crons run only in the fhir-gateway-cron Deployment (single
            # replica). Web replicas keep the scheduler disabled so jobs fire
            # exactly once per env.
            - name: RUN_CRONS
              value: "false"
            # Per-env values (URLs, legacy single-tenant client id) are
            # supplied via the overlay patch. Joi rejects startup if any of
            # these are missing — keep them in the patch even when empty.
            - name: FHIR_BASE_URL
              value: __FHIR_BASE_URL__
            - name: FHIR_TOKEN_URL
              value: __FHIR_TOKEN_URL__
            - name: FHIR_CLIENT_ID
              value: __FHIR_CLIENT_ID__
            - name: FHIR_CLIENT_SECRET
              value: __FHIR_CLIENT_SECRET__
            # EXPORT_SITE_ID is the tenant code whose export config (URLs +
            # credentials) the backend pulls from multi-tenant-sites.json +
            # the bundled credentials secret. Set per-env in the overlay only —
            # the export-client factory eagerly resolves this at boot regardless
            # of EXPORT_ENABLED, so any literal placeholder here would crash
            # envs that intentionally have no export target. EXPORT_FHIR_URL /
            # EXPORT_TOKEN_URL / EXPORT_CLIENT_ID / EXPORT_CLIENT_SECRET were
            # removed from the Joi schema in v0.2.38 — do not re-add.
          volumeMounts:
            - name: tenant-credentials
              mountPath: /etc/arogyam
              readOnly: true
          # arogyam-backend has no dedicated /healthz endpoint (the only
          # always-200 route is /api/sites, which queries the registry).
          # TCP probe is sufficient: proves the listener is up without
          # tying readiness to registry/cron state. Revisit if backend
          # adds a real health endpoint.
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 4
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: tenant-credentials
          secret:
            secretName: arogyam-tenant-credentials
            optional: true
            items:
              - key: tenant-credentials.json
                path: tenant-credentials.json
