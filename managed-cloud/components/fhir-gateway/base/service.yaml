apiVersion: v1
kind: Service
metadata:
  name: fhir-gateway
  namespace: arogyam
  labels:
    app.kubernetes.io/name: fhir-gateway
spec:
  type: ClusterIP
  # part-of matches pods of both the web (fhir-gateway) and cron
  # (fhir-gateway-cron) Deployments — the cron pod serves traffic too.
  selector:
    app.kubernetes.io/part-of: fhir-gateway
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
