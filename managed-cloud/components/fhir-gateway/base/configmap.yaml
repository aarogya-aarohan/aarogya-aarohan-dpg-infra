apiVersion: v1
kind: ConfigMap
metadata:
  name: fhir-gateway-config
  namespace: arogyam
data:
  # Non-secret app env consumed via envFrom on the Deployment. Joi schema
  # source of truth: arogyam-backend src/app/core/config-schema.ts.
  # Per-env overrides (URLs, feature flags) live in the overlay patch.
  PORT: "3000"
  GCP_PROJECT_ID: __PROJECT_ID__
  MULTI_TENANT_CONFIG_BUCKET: your-app-config-bucket
  MULTI_TENANT_CONFIG_OBJECT: aa-api/multi-tenant-sites.json
  # The tenant-credentials JSON is materialised by ESO from the per-env SM
  # secret aa-{env}-arogyam-tenant-credentials and mounted as a file at the
  # path below. The backend reads MULTI_TENANT_SECRETS_FILE; MULTI_TENANT_SECRETS_ID
  # (the SM resource id) is set per-env in the overlay patch in case Joi still
  # requires it.
  MULTI_TENANT_SECRETS_FILE: /etc/arogyam/tenant-credentials.json

  DIAGNOSIS_ENABLED: "true"
  DIAGNOSIS_QUESTIONNAIRE_REFERENCE: Questionnaire/OralCancerScreenPatient
  DIAGNOSIS_TASK_INSTANTIATE_CANONICAL: https://midas.iisc.ac.in/fhir/ActivityDefinition/oral-cancer-screen-patient
  DIAGNOSIS_TASK_FOLLOW_UP_URI: https://midas.iisc.ac.in/fhir/Task/oral-cancer-screening-follow-up
  # Not a rate limit — it is the WIDTH OF A WINDOW over the candidate query, and
  # that query is id-ordered, so a candidate that cannot progress sits at the head
  # of it forever. processAll() searches Encounter with _count=this, then shuffles
  # what came back: the shuffle reorders those rows, it cannot reach past them.
  #
  # Measured on one production tenant (2026-08-24): 302 candidates, of which ~296 are June
  # screenings whose DocumentReferences were deleted after import, so
  # they can never satisfy the upload gate. At 100 they filled the window and
  # phase-1 logged "All document not yet uploaded" 300 times per 15 minutes while
  # three cases screened that morning were never dequeued at all.
  #
  # 500 clears every current tenant's candidate count. It is a stopgap: the real
  # fix is to page the candidate query and exclude encounters that cannot pass,
  # which needs an arogyam-backend change.
  DIAGNOSIS_PER_CRON_ENCOUNTER: "500"
  DIAGNOSIS_CRON_LOCK_MINUTES: "30"

  EXPORT_ENABLED: "true"
  EXPORT_PER_CRON_ENCOUNTER: "1"
  EXPORT_CRON_LOCK_MINUTES: "5"

  READER_ENABLED: "false"
  READER_PER_CRON_MEDIA: "100"
  READER_CRON_LOCK_MINUTES: "30"
  READER_TASK_INTERVAL_DAYS: "1"

  UPLOAD_STATUS_ENABLED: "true"
  UPLOAD_STATUS_CRON_LOCK_MINUTES: "2880"
  UPLOAD_STATUS_APPLY: "true"

  # Phase-specific diagnosis tuning (Joi-optional). Generic defaults from
  # backend team — override per-env in the overlay if staging diverges.
  DIAGNOSIS_NON_SUSP_PERCENT: "5"
  DIAGNOSIS_NON_SUSPICIOUS_CRON_LOCK_MINUTES: "480"
  DIAGNOSIS_NON_SUSPICIOUS_DAILY_CRON_EXPRESSION: EVERY_DAY_AT_6PM
  DIAGNOSIS_NON_SUSPICIOUS_MIN_ENCOUNTER_AGE_HOURS: "24"

  DIAGNOSIS_SPECIALIST_CRON_LOCK_MINUTES: "480"
  DIAGNOSIS_SPECIALIST_DAILY_CRON_EXPRESSION: EVERY_DAY_AT_6PM
  DIAGNOSIS_SPECIALIST_TASK_LIMIT: "25"
  DIAGNOSIS_SPECIALIST_SOURCE_TASK_ID_EXTENSION_URL: http://midas.iisc.ac.in/diagnosis-specialist-source-task-id
  DIAGNOSIS_SPECIALIST_REVIEW_QUESTIONNAIRE_REFERENCE: Questionnaire/OralCancerReviewPatient
  DIAGNOSIS_SPECIALIST_REVIEW_TASK_INSTANTIATE_CANONICAL: https://midas.iisc.ac.in/fhir/ActivityDefinition/oral-cancer-review-patient
