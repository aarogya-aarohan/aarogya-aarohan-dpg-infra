# Promoted from staging — staging has scraped
# this successfully since 2026-08-25 (confirmed live via metricDescriptors);
# production never had this CR at all, which is why fhir-gateway's dashboard
# tiles showed no aa-prod data (the same gap was fixed for hapi-fhir and
# keycloak).
#
# Selector is app.kubernetes.io/part-of: fhir-gateway, NOT
# app.kubernetes.io/name: fhir-gateway — matches both the fhir-gateway (web)
# and fhir-gateway-cron Deployments' pods, both of which actually run and
# serve traffic in production (web=1 + cron=1, unlike staging where web is
# scaled to 0). Selector kept identical to staging's on purpose: it already
# correctly picks up whichever Deployment(s) are actually running in a given
# env, staging or production alike.
apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: fhir-gateway
  namespace: arogyam
spec:
  selector:
    matchLabels:
      app.kubernetes.io/part-of: fhir-gateway
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
