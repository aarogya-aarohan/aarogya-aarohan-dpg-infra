apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: arogyam
resources:
  - ../../base
  - podmonitoring.yaml
images:
  - name: iisc/arogyam-fhir-gateway
    newTag: v0.2.57
patches:
  # labelSelector (not name) so the per-env env block lands on both the web
  # and cron Deployments; kustomize ignores the patch body's metadata.name for
  # renaming (allowNameChange defaults to false). Replicas come from base:
  # web=1 + cron=1 keeps production at 2 serving pods, same capacity as before
  # the split.
  - path: patch-deployment.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      labelSelector: app.kubernetes.io/part-of=fhir-gateway
  # Cron-only, by name: the labelSelector patch above deliberately hits both
  # Deployments, and these resources are for the cron pod alone.
  - path: patch-deployment-cron.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: fhir-gateway-cron
  - target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: fhir-gateway
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: production.example.org
