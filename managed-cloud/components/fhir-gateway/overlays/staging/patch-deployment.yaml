apiVersion: apps/v1
kind: Deployment
metadata:
  name: fhir-gateway
  namespace: arogyam
spec:
  template:
    spec:
      containers:
        - name: fhir-gateway
          # Staging-only override: the app gained a real /health route
          # (PR #43, merged 2026-08-21) that base/deployment.yaml's tcpSocket
          # probes and comment predate. Switching here first, not in base/,
          # because base is shared by both overlays/staging and
          # overlays/production and both Applications auto-sync from
          # aa-infra@main — a base change would hit prod the moment this
          # merges. Promote to base once this is verified working in aa-stg
          # and production is ready (same pattern as hapi-fhir's actuator
          # config in components/hapi-fhir/overlays/staging/patch-configmap.yaml).
          # This patch lands on both the fhir-gateway and fhir-gateway-cron
          # Deployments (labelSelector target below, both have a container
          # named fhir-gateway) — in aa-stg specifically, fhir-gateway-cron is
          # the one actually serving traffic (web replicas=0 here), so that's
          # the pod to verify /health against before merging this.
          readinessProbe:
            # Strategic-merge adds httpGet alongside the base's tcpSocket
            # rather than replacing it, and a probe may carry only one
            # handler — the explicit null deletes the inherited one.
            tcpSocket: null
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            tcpSocket: null
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 4
          # Per-env env. Strategic-merge by name: each entry below replaces the
          # placeholder of the same name in base/deployment.yaml. Keep all
          # Joi-required fields present (empty value still satisfies presence
          # for non-string-validated keys; tighten as backend team supplies
          # real per-env values).
          env:
            - name: SERVER_NAME
              value: multi_tenant_staging
            - name: MULTI_TENANT_SECRETS_ID
              value: aa-stg-arogyam-tenant-credentials
            # Per-env overrides of base ConfigMap defaults.
            # EXPORT disabled in staging: no export destination tenant is
            # configured (production exports to aa-tamil-nadu; staging has no
            # equivalent yet). Re-enable + set EXPORT_SITE_ID once a staging
            # export target exists.
            - name: EXPORT_ENABLED
              value: "false"
            - name: DIAGNOSIS_NON_SUSPICIOUS_DAILY_CRON_EXPRESSION
              value: "30 12 * * *"
            - name: DIAGNOSIS_SPECIALIST_DAILY_CRON_EXPRESSION
              value: "30 12 * * *"
            # Backend team has not supplied staging values for these yet;
            # leave as placeholders so the keys remain present. FHIR_TOKEN_URL /
            # FHIR_CLIENT_ID / FHIR_CLIENT_SECRET are Joi-optional in v0.2.38
            # (legacy fallback only) — drop once the scheduler fan-out
            # ships.
            - name: FHIR_BASE_URL
              value: http://hapi-fhir.arogyam.svc.cluster.local/fhir
            - name: FHIR_TOKEN_URL
              value: __FHIR_TOKEN_URL_STG__
            - name: FHIR_CLIENT_ID
              value: __FHIR_CLIENT_ID_STG__
            - name: FHIR_CLIENT_SECRET
              value: __FHIR_CLIENT_SECRET_STG__
            # EXPORT_SITE_ID intentionally omitted in staging: the export-client
            # factory eagerly resolves it via TenantRegistry.get at boot, so a
            # placeholder value would crash. Joi made the key optional in
            # v0.2.38; absent → factory short-circuits. Set this once a real
            # staging export tenant exists (and re-enable EXPORT_ENABLED).
