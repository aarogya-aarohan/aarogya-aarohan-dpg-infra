apiVersion: apps/v1
kind: Deployment
metadata:
  name: hapi-fhir
  namespace: arogyam
  labels:
    app.kubernetes.io/name: hapi-fhir
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: hapi-fhir
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hapi-fhir
    spec:
      serviceAccountName: hapi-fhir
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: hapi-fhir
                topologyKey: kubernetes.io/hostname
      containers:
        - name: hapi-fhir
          image: iisc/fhir-server:v7.4.19
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: hapi-db-creds
          env:
            - name: SPRING_CONFIG_LOCATION
              value: file:/etc/hapi/application.yaml
          volumeMounts:
            - name: config
              mountPath: /etc/hapi
              readOnly: true
          readinessProbe:
            httpGet:
              path: /fhir/metadata
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /fhir/metadata
              port: http
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 4
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              # Raised from 2. Both production replicas sat pinned at ~2000m —
              # their exact limit — continuously, including while nothing was
              # scraping them, so HAPI has been CPU-throttled as a standing
              # condition rather than only under load.
              #
              # Note 4 exceeds a node's 3920m allocatable, so in practice this
              # is "uncapped up to whatever the node has spare" rather than a
              # true 4-CPU ceiling. Requests are unchanged at 1, so scheduling
              # and bin-packing are unaffected; only the throttle moves.
              cpu: "4"
              memory: 4Gi
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.13.0
          imagePullPolicy: IfNotPresent
          args:
            - --private-ip
            - --auto-iam-authn=false
            - --port=5432
            - __DB_CONNECTION_NAME__
          securityContext:
            runAsNonRoot: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: hapi-fhir-config
            items:
              - key: application.yaml
                path: application.yaml
