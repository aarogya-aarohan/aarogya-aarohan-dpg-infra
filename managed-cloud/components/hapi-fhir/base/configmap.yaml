apiVersion: v1
kind: ConfigMap
metadata:
  name: hapi-fhir-config
  namespace: arogyam
data:
  # TODO(rls): once Postgres RLS rollout lands, add an init container or Flyway
  # job that creates current_partition_id() and ALTER TABLE ... ENABLE RLS on
  # HAPI-owned tables. See the architecture guide (docs/architecture.md) — RLS is the
  # defense-in-depth layer; partition_id-on-search is the primary enforcement.
  application.yaml: |
    spring:
      main:
        allow-circular-references: true
      datasource:
        url: jdbc:postgresql://127.0.0.1:5432/arogyam?sslmode=disable
        driver-class-name: org.postgresql.Driver
        max-active: 15
      jpa:
        properties:
          hibernate.format_sql: false
          hibernate.show_sql: false
          hibernate.dialect: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgres94Dialect
          hibernate.search.enabled: false
    hapi:
      fhir:
        fhir_version: R4
        server_address: /fhir
        # The platform FHIR bundle seeded by scripts/seed-fhir-bundle.sh
        # includes a Composition whose author references Practitioner/arogyam-superadmin,
        # which isn't part of the bundle. Bulk-seeding and business-data writes both
        # rely on the arogyam-backend layer for referential checks, so HAPI's
        # built-in enforcement stays off platform-wide.
        enforce_referential_integrity_on_write: false
        # Required for `:missing=true` predicates on custom SearchParameters to
        # generate valid SQL. With this disabled (HAPI 7.2.0 default), the
        # predicate builder allocates HFJ_SPIDX_STRING but never WHERE-references
        # it, and Hibernate 6 aborts with "Columns used for unreferenced tables".
        # Enabling stores explicit "missing" entries in the SPIDX tables; new
        # writes get them automatically. Existing rows need a one-time $reindex
        # before `:missing=true` returns correct results.
        enable_index_missing_fields: true
        # Register the Aarogya Aarohan fork (aarogya-aarohan-dpg-fhir-server)'s OpenSRP providers so PractitionerDetail
        # and LocationHierarchy appear in the CapabilityStatement. The bundled
        # application.yaml at fhir-server src/main/resources/application.yaml:207
        # sets the same key; we re-declare it here because SPRING_CONFIG_LOCATION
        # on the Deployment replaces (not layers) Spring's config search path.
        custom-provider-classes: ca.uhn.fhir.jpa.starter.opensrp.practionerdetail.PractitionerDetailsResourceProvider,ca.uhn.fhir.jpa.starter.opensrp.location.LocationHierarchyResourceProvider
        partitioning:
          # Must be false: HAPI internal code (e.g. SearchParamRegistry refresh
          # on startup) issues RequestPartitionId.allPartitions() queries, which
          # QueryStack rejects with HAPI-1220 when this flag is true. Tenant
          # isolation is unaffected — the partition_id column still scopes
          # per-request queries; this only disables a search-hash optimization.
          partitioning_include_in_search_hashes: false
          # Let allow_references_across_partitions inherit the fork's default
          # (ALLOWED_UNQUALIFIED, set in iisc/fhir-server:v7.4.10). Tenant-partition
          # writes need to reference Questionnaire / ValueSet / CodeSystem etc.
          # that live in the DEFAULT partition; without this they trip HAPI-1095.
          tenant_identification_strategy: URL_BASED
          # Tenant reads for these types are transparently served from the
          # DEFAULT partition (where seed-fhir-bundle.sh lands them). fhir-app
          # fetches Composition + its sectioned resources via /fhir/<tenant>/...
          # at startup, but the data only lives in DEFAULT. Read-only — writes
          # from a tenant URL are not rerouted.
          default_only_resource_types:
            - Composition
            - StructureMap
            - PlanDefinition
            - Library
            - Binary
          # Location is partitionable and each tenant owns its own location tree
          # (in the tenant partition), while the shared physical-location-* seeds
          # live in DEFAULT. Merge so a tenant GET — read-by-id or search — returns
          # the union of both, instead of being forced to DEFAULT (which 404s the
          # tenant's own Locations). Writes stay tenant-scoped. See
          # SystemAwareRequestTenantPartitionInterceptor#mergeTenantWithDefault.
          merge_default_resource_types:
            - Location
        cors:
          allow_credentials: true
          allowed_origin:
            - "*"
        binary_storage_enabled: true
        binary_storage: Gcs
        binary_storage_gcs:
          # Per-request bucket selection: the Aarogya Aarohan fhir-server fork's
          # GcsBinaryStorageSvc substitutes {partition} at runtime from the
          # current URL_BASED tenant slug. Each tenant's bucket is created by
          # terraform/modules/tenant-gcs and direct-WI grants the hapi-fhir
          # KSA storage.objectAdmin on it; no static creds, ADC picks up WI.
          # $binary-access-write at /fhir/DEFAULT/... is rejected by the svc.
          # Kustomize can't substitute inside this string, so overlays carry a
          # patch-configmap.yaml that re-declares application.yaml with the
          # per-env value (aa-stg-... / aa-prod-...) filled in.
          bucket_name_template: __HAPI_GCS_BUCKET_TEMPLATE__
          base_path: arogyam-fhir/images
        security:
          inbound:
            authentication:
              enabled: true
              # Let unauthenticated requests through to the authorization layer so /metadata,
              # /capabilities, and anything in anonymous-access-permission below stay public.
              proceed-to-authorization-on-no-auth: true
              proceed-to-authorization-on-failure: false
              # Realm name = tenant slug (no prefix). Constrained per-env to this cluster's
              # Keycloak host so tokens minted by the other env's Keycloak cannot satisfy
              # auth here. Overlay-substituted via patch-configmap.yaml.
              allowed-issuer-patterns:
                - __HAPI_ALLOWED_ISSUER_REGEX__
            authorization:
              enabled: true
              allow-anonymous-access: true
              # Mirrors the fork's default list (fhir-server application.yaml:298-313):
              # read-only access to definitional resources + transaction/batch/capabilities.
              # The dashboard relies on this to pull Composition + sections without a token.
              anonymous-access-permission:
                - name: fhir_read_all_of_type
                  arguments:
                    - Binary
                    - Composition
                    - Questionnaire
                    - StructureMap
                    - List
                    - PlanDefinition
                    - Library
                    - Measure
                    - Basic
                    - Parameters
                - name: fhir_transaction
                - name: fhir_capabilities
                - name: fhir_batch
