# Production rendering of base/configmap.yaml: re-declares the full application.yaml
# with the two per-env placeholders substituted (bucket_name_template +
# allowed-issuer-patterns). SPRING_CONFIG_LOCATION on the Deployment replaces (not
# layers) Spring's config search path, and Kustomize can't substitute inside the
# `application.yaml` string field, so the file is duplicated rather than merged.
# Keep in sync with components/hapi-fhir/base/configmap.yaml; the only deltas should
# be __HAPI_GCS_BUCKET_TEMPLATE__ → aa-prod-{partition}-fhir-media and
# __HAPI_ALLOWED_ISSUER_REGEX__ → ^https://production\.example\.org/auth/realms/[^/]+$
apiVersion: v1
kind: ConfigMap
metadata:
  name: hapi-fhir-config
  namespace: arogyam
data:
  application.yaml: |
    spring:
      main:
        allow-circular-references: true
        # Required when hapi.fhir.cr.enabled=true: the fork's StarterCrR4Config and
        # upstream CrProcessorConfig both define `questionnaireResponseProcessorFactory`,
        # so CR won't boot without permitting the later definition to override.
        allow-bean-definition-overriding: true
      datasource:
        url: jdbc:postgresql://127.0.0.1:5432/arogyam?sslmode=disable
        driver-class-name: org.postgresql.Driver
        max-active: 15
      jpa:
        properties:
          hibernate.format_sql: false
          hibernate.show_sql: false
          hibernate.dialect: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgres94Dialect
          hibernate.search.enabled: false
    hapi:
      fhir:
        fhir_version: R4
        server_address: /fhir
        # Registers the Clinical Reasoning module so QuestionnaireResponse/$extract
        # (and the other CR operations) are wired up. The fork gates StarterCrR4Config
        # behind @Conditional(CrConfigCondition) which reads this flag (default false);
        # without it HAPI returns "does not know how to handle POST $extract".
        cr:
          enabled: true
        enforce_referential_integrity_on_write: false
        # Required for `:missing=true` predicates on custom SearchParameters to
        # generate valid SQL. With this disabled (HAPI 7.2.0 default), the
        # predicate builder allocates HFJ_SPIDX_STRING but never WHERE-references
        # it, and Hibernate 6 aborts with "Columns used for unreferenced tables".
        # Enabling stores explicit "missing" entries in the SPIDX tables; new
        # writes get them automatically. Existing rows need a one-time $reindex
        # before `:missing=true` returns correct results.
        enable_index_missing_fields: true
        custom-provider-classes: ca.uhn.fhir.jpa.starter.opensrp.practionerdetail.PractitionerDetailsResourceProvider,ca.uhn.fhir.jpa.starter.opensrp.location.LocationHierarchyResourceProvider
        partitioning:
          partitioning_include_in_search_hashes: false
          tenant_identification_strategy: URL_BASED
          default_only_resource_types:
            - Composition
            - StructureMap
            - PlanDefinition
            - Library
            - Binary
          # Merge tenant + DEFAULT on Location reads so a tenant sees both its own
          # location tree and the shared physical-location-* seeds. See base
          # configmap / SystemAwareRequestTenantPartitionInterceptor.
          merge_default_resource_types:
            - Location
        cors:
          allow_credentials: true
          allowed_origin:
            - "*"
        binary_storage_enabled: true
        binary_storage: Gcs
        binary_storage_gcs:
          # Per-request bucket selection: the Aarogya Aarohan fhir-server fork's
          # GcsBinaryStorageSvc substitutes {partition} at runtime from the
          # current URL_BASED tenant slug. Each tenant's bucket is created by
          # terraform/modules/tenant-gcs and direct-WI grants the hapi-fhir
          # KSA storage.objectAdmin on it; no static creds, ADC picks up WI.
          # $binary-access-write at /fhir/DEFAULT/... is rejected by the svc.
          bucket_name_template: aa-prod-{partition}-fhir-media
          base_path: arogyam-fhir/images
        security:
          inbound:
            authentication:
              enabled: true
              # Let unauthenticated requests through to the authorization layer so /metadata,
              # /capabilities, and anything in anonymous-access-permission below stay public.
              proceed-to-authorization-on-no-auth: true
              proceed-to-authorization-on-failure: false
              # Realm name = tenant slug (no prefix). Constrain to this cluster's KC host so
              # tokens minted by the staging Keycloak cannot satisfy auth here.
              allowed-issuer-patterns:
                - "^https://production\\.example\\.org/auth/realms/[^/]+$"
            authorization:
              enabled: true
              allow-anonymous-access: true
              # Mirrors the fork's default list (fhir-server application.yaml:298-313):
              # read-only access to definitional resources + transaction/batch/capabilities.
              # The dashboard relies on this to pull Composition + sections without a token.
              anonymous-access-permission:
                - name: fhir_read_all_of_type
                  arguments:
                    - Binary
                    - Composition
                    - Questionnaire
                    - StructureMap
                    - List
                    - PlanDefinition
                    - Library
                    - Measure
                    - Basic
                    - Parameters
                - name: fhir_transaction
                - name: fhir_capabilities
                - name: fhir_batch
    # Exposes /actuator/prometheus so GMP's hapi-fhir PodMonitoring (identical
    # scrape config in both envs -- see overlays/{staging,production}/podmonitoring.yaml)
    # can actually reach it. Spring Boot Actuator exposes only `health` by default;
    # without this block /actuator/prometheus 404s and every scrape counts as a
    # failure (up=0), which is why the dashboard's HAPI FHIR JVM/HTTP tiles have
    # shown staging-only data. Promoted from staging's patch-configmap.yaml, which
    # already carries this block -- requires a rollout of this Deployment to pick up.
    management:
      endpoints:
        web:
          exposure:
            include: health,prometheus,metrics
      metrics:
        export:
          prometheus:
            enabled: true
