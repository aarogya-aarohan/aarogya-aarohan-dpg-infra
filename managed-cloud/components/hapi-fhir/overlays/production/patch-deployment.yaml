apiVersion: apps/v1
kind: Deployment
metadata:
  name: hapi-fhir
  namespace: arogyam
spec:
  # One per node, against the three-node pool. Not for throughput — the two
  # replicas serve at ~140m CPU apiece, nowhere near the 1 CPU they request —
  # but so that losing a node costs a third of HAPI rather than a half.
  #
  # Base stays at 2 and staging pins 1; this is the only env with three nodes
  # to spread across.
  #
  # The anti-affinity in base stays *preferred*, deliberately. Making it
  # required would guarantee the spread but deadlock every rollout: maxSurge 1
  # puts a fourth pod on a three-node pool with one HAPI pod already on each
  # node, so the surge pod would have nowhere to land and the autoscaler
  # cannot help — node_max_count is 3. Soft placement spreads them in practice
  # and keeps rollouts able to finish.
  replicas: 3
  template:
    spec:
      containers:
        - name: cloud-sql-proxy
          args:
            - --private-ip
            - --auto-iam-authn=false
            - --port=5432
            - your-gcp-project-id:asia-south1:aa-prod-pg
