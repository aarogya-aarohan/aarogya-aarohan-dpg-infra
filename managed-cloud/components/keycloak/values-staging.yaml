replicaCount: 1

# Staging-only for now: this chart is pinned at 21.0.0 (see keycloak-staging.yaml)
# but the actual image is overridden to Keycloak 26.3.2 (values-base.yaml) — a
# much newer release. Chart 21.0.0's own templates expect metrics on the plain
# http port at /metrics; Keycloak itself moved metrics to a separate
# "management" port starting around v22. Which one actually wins here hasn't
# been confirmed live yet. metrics.enabled: true is correct either way — it's
# the PodMonitoring (port name + path) that needs to wait on a live check via
# `kubectl describe pod` / `kubectl port-forward` before being written, so we
# don't repeat the fhir-gateway mistake of pointing a selector/port at
# something that silently matches nothing.
metrics:
  enabled: true

serviceAccount:
  annotations:
    iam.gke.io/gcp-service-account: aa-cloudsql-stg@your-gcp-project-id.iam.gserviceaccount.com

ingress:
  hostname: staging.example.org

extraEnvVars:
  - name: KC_DB_URL_PROPERTIES
    value: "?sslmode=disable"
  - name: KC_PROXY_HEADERS
    value: "xforwarded"
  - name: KC_HTTP_ENABLED
    value: "true"
  - name: KC_HOSTNAME_STRICT
    value: "true"
  # KC_HOSTNAME must include the /auth path so issuer URLs (e.g. in OIDC
  # discovery) match http-relative-path. Origin-only here makes Keycloak
  # render issuer as https://host/realms/master, which 404s.
  - name: KC_HOSTNAME
    value: "https://staging.example.org/auth"
  # The chart's own `metrics.enabled` (above) only wires up a Service/port for
  # scraping — it does NOT tell the Keycloak process itself to turn its
  # metrics endpoint on. Confirmed live on 2026-09-02: after metrics.enabled
  # synced, the pod had zero metrics-related env vars and /auth/metrics still
  # 404'd. Chart v21.0.0 predates the config style Keycloak 26.3.2 (upstream,
  # Quarkus-based) actually uses — KC_METRICS_ENABLED is the real switch,
  # same pattern as every other KC_* var below.
  - name: KC_METRICS_ENABLED
    value: "true"

# Staging-only PodMonitoring for the metrics endpoint confirmed live on
# 2026-09-02. This chart bundles the aerogear keycloak-metrics-spi plugin,
# NOT Keycloak's own native metrics system, so the endpoint is per-realm
# REST API, not a global /metrics path: http://<pod>:8080/auth/realms/master/metrics
# (verified with a live curl from inside the pod). Using `extraDeploy` since
# this chart has no Kustomize base/overlay structure the way fhir-gateway
# does — not yet confirmed the chart actually honors extraDeploy for this
# pinned version; verify `kubectl get podmonitoring keycloak -n arogyam`
# exists and is Configured after this merges and syncs.
extraDeploy:
  - |
    apiVersion: monitoring.googleapis.com/v1
    kind: PodMonitoring
    metadata:
      name: keycloak
      namespace: arogyam
    spec:
      selector:
        matchLabels:
          app.kubernetes.io/name: keycloak
      endpoints:
        - port: http
          path: /auth/realms/master/metrics
          interval: 30s

# Observed 6m CPU / 523Mi against 500m / 1Gi reserved (base values). Limits
# repeated from values-base unchanged, so the heap ceiling this env has been
# running on (25% of 2Gi = 512Mi) does not move.
resources:
  requests:
    cpu: 150m
    memory: 768Mi
  limits:
    cpu: "2"
    memory: 2Gi

sidecars:
  - name: cloud-sql-proxy
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.13.0
    imagePullPolicy: IfNotPresent
    args:
      - --private-ip
      - --auto-iam-authn=false
      - --port=5432
      - your-gcp-project-id:asia-south1:aa-stg-pg
    securityContext:
      runAsNonRoot: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
