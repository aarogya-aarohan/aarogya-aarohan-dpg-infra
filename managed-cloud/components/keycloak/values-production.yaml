replicaCount: 1

# Promoted from staging. Confirmed live in
# aa-stg since 2026-09-02: metrics.enabled wires the Service/port, but the
# real switch for this chart (v21.0.0) pinned against an overridden
# Keycloak 26.3.2 image is KC_METRICS_ENABLED below, not this key alone.
metrics:
  enabled: true

serviceAccount:
  annotations:
    iam.gke.io/gcp-service-account: aa-cloudsql-prod@your-gcp-project-id.iam.gserviceaccount.com

ingress:
  hostname: production.example.org

extraEnvVars:
  - name: KC_DB_URL_PROPERTIES
    value: "?sslmode=disable"
  - name: KC_PROXY_HEADERS
    value: "xforwarded"
  - name: KC_HTTP_ENABLED
    value: "true"
  - name: KC_HOSTNAME_STRICT
    value: "true"
  - name: KC_HOSTNAME
    value: "https://production.example.org/auth"
  # Real metrics switch for this chart/image combo — see the comment on
  # `metrics:` above. Confirmed live in aa-stg 2026-09-02.
  - name: KC_METRICS_ENABLED
    value: "true"

# Promoted from staging. This chart bundles the
# aerogear keycloak-metrics-spi plugin, not Keycloak's own native metrics
# system, so the endpoint is per-realm REST, not a global /metrics path —
# confirmed live in aa-stg 2026-09-02 via an exec'd curl to
# http://<pod>:8080/auth/realms/master/metrics. Using extraDeploy since this
# chart has no Kustomize base/overlay structure. Verify
# `kubectl get podmonitoring keycloak -n arogyam` is Configured in aa-prod
# after this merges and syncs, same as was done for staging.
extraDeploy:
  - |
    apiVersion: monitoring.googleapis.com/v1
    kind: PodMonitoring
    metadata:
      name: keycloak
      namespace: arogyam
    spec:
      selector:
        matchLabels:
          app.kubernetes.io/name: keycloak
      endpoints:
        - port: http
          path: /auth/realms/master/metrics
          interval: 30s

# Observed steady state is 6m CPU and 548Mi RSS, against a full CPU and 2Gi
# reserved — the reservation was booking a quarter of a node to idle. Requests
# now track reality so the scheduler stops holding that capacity back.
#
# The memory limit doubles as this JVM's heap setting: no -Xmx is set, so the
# heap ceiling is MaxRAMPercentage's 25% of the limit. 4Gi -> 2Gi therefore
# takes the max heap from 1Gi to 512Mi. Realm caches live in that heap and
# prod carries a dozen realms, so if Keycloak starts showing GC pressure this
# limit is the first thing to put back, not the requests.
resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    cpu: "1"
    memory: 2Gi

sidecars:
  - name: cloud-sql-proxy
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.13.0
    imagePullPolicy: IfNotPresent
    args:
      - --private-ip
      - --auto-iam-authn=false
      - --port=5432
      - your-gcp-project-id:asia-south1:aa-prod-pg
    securityContext:
      runAsNonRoot: true
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
