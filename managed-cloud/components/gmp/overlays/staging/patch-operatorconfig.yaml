# Not a strategic-merge patch against a resource in our own `resources:` list
# — OperatorConfig is a singleton the GMP addon itself creates in gmp-public
# on cluster bring-up, and this repo never owns the base object. ArgoCD syncs
# this as a plain resource with ServerSideApply=true (see
# apps/platform/gmp-staging.yaml), which merges `collection.externalLabels`
# into the addon-managed object instead of replacing it outright.
#
# This is NOT load-bearing. Per the monitoring guide (docs/monitoring.md), the dashboard
# (Phases 4-6, out of this component's scope) filters on the `cluster` label
# that GMP stamps on every series for free — env=staging here only makes
# alert notification text and ad-hoc Metrics Explorer queries more readable
# than cluster=aa-stg. If ArgoCD and the GMP operator start flapping on
# reconciling this singleton, the fix is to delete this file (and its
# `resources:` entry in kustomization.yaml) and live with `cluster` alone —
# nothing else in this repo depends on `env` existing as a label.
apiVersion: monitoring.googleapis.com/v1
kind: OperatorConfig
metadata:
  name: config
  namespace: gmp-public
collection:
  externalLabels:
    env: staging
