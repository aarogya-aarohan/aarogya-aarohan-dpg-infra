apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  # Full OperatorConfig object, not a patch target — see the header comment
  # in patch-operatorconfig.yaml for why it's listed as a resource rather
  # than under `patches:`. Deliberately kept out of base: the base namespace
  # (ingress-nginx) doesn't apply to this gmp-public-scoped singleton, and
  # the externalLabels value (env: staging) is the one genuine per-env
  # difference this component has .
  - patch-operatorconfig.yaml
