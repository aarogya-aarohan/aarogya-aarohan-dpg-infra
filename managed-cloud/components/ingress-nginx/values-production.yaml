controller:
  replicaCount: 2
  resources:
    # Observed 6m CPU / 121Mi per replica. Limits stay where they are so a
    # traffic spike still has room; only the reservation comes down.
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
              app.kubernetes.io/component: controller
          topologyKey: kubernetes.io/hostname
  service:
    annotations:
      # Tells GKE to create a standalone zonal NEG tracking the ingress-nginx
      # controller pods. The regional external HTTPS LB `(your regional HTTPS load balancer)`
      # uses this NEG as a backend for `production.example.org`.
      # Backend service + URL-map host rule are owned by the platform team —
      # see docs/deployment-guide.md (prerequisites).
      cloud.google.com/neg: '{"exposed_ports": {"80":{"name":"neg-aa-prod-ingress-asouth1-c"}}}'
