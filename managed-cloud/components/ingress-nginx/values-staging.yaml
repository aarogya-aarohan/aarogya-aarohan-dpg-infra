controller:
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    annotations:
      # Tells GKE to create a standalone zonal NEG tracking the ingress-nginx
      # controller pods. The regional external HTTPS LB `(your regional HTTPS load balancer)`
      # uses this NEG as a backend for `staging.example.org`. Backend
      # service + URL-map host rule are owned by the platform team — see
      # docs/deployment-guide.md (prerequisites).
      cloud.google.com/neg: '{"exposed_ports": {"80":{"name":"neg-aa-stg-ingress-asouth1-c"}}}'
