apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: arogyam-dashboard
  namespace: arogyam
  annotations:
    # NextAuth chunks session cookies at ~4 KiB; the OIDC callback response
    # carries 2+ Set-Cookie chunks plus the usual headers. Default 4k
    # proxy_buffer_size overflows and ingress-nginx 502s, which causes the
    # browser to re-fetch the callback and burn the (already-redeemed) code.
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    # /api/download-report pages an entire tenant into memory before it emits
    # anything, so a large export holds the connection open for minutes with no
    # bytes flowing. nginx's default proxy_read_timeout is 60s, which silently
    # returned a 504 HTML page to the browser mid-export.
    #
    # Measured against production: three mid-size tenants (47-54s) all
    # completed; two larger ones (65.6s and 215.2s) both 504'd. The cutoff
    # sat exactly at the 60s default.
    #
    # 600s, not higher: the platform load balancer in front of this ingress cuts
    # at 600s regardless, so a larger value here would only be theatre. The
    # biggest tenant at 40 pages, finishes in 215s — roughly 2.8x headroom.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
spec:
  ingressClassName: nginx
  rules:
    - host: __HOSTNAME__
      http:
        paths:
          - path: /dashboard
            pathType: Prefix
            backend:
              service:
                name: arogyam-dashboard
                port:
                  number: 80
