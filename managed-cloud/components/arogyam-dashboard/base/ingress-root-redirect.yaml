apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: arogyam-root-redirect
  namespace: arogyam
  annotations:
    # 301 redirect at the ingress edge; backend is never actually reached.
    nginx.ingress.kubernetes.io/permanent-redirect: /dashboard
spec:
  ingressClassName: nginx
  rules:
    - host: __HOSTNAME__
      http:
        paths:
          - path: /
            pathType: Exact
            backend:
              service:
                name: arogyam-dashboard
                port:
                  number: 80
