apiVersion: apps/v1
kind: Deployment
metadata:
  name: arogyam-dashboard
  namespace: arogyam
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: arogyam-dashboard
          env:
            - name: APP_ENV
              value: production
            # Read at runtime by the server (see dashboard lib/featureFlags.ts).
            # Deliberately not NEXT_PUBLIC_: that form is inlined into the bundle
            # at build time, so it never reached the image and could not differ
            # between staging and production.
            #
            # False here hides the sidebar link ONLY. /admin/insights is still
            # served, and still enforces its own session and userType checks —
            # this is not access control, it just stops the page being
            # advertised while the measure numbers are being checked. Staging
            # keeps it true.
            - name: ENABLE_INSIGHTS_DASHBOARD
              value: "true"
        # Promoted from staging — identical sidecar to
        # overlays/staging/patch-deployment.yaml. See podmonitoring.yaml's
        # header comment in this directory for why.
        - name: blackbox-exporter
          image: prom/blackbox-exporter:v0.25.0
          args:
            - --config.file=/etc/blackbox/blackbox.yml
          ports:
            - name: blackbox
              containerPort: 9115
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: blackbox-config
              mountPath: /etc/blackbox
      volumes:
        - name: blackbox-config
          configMap:
            name: blackbox-config
