apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: arogyam
resources:
  - ../../base
  # Promoted from staging — see podmonitoring.yaml's header
  # comment.
  - blackbox-config.yaml
  - podmonitoring.yaml
images:
  - name: iisc/arogyam-dashboard
    newTag: f33d302
patches:
  - path: patch-deployment.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: arogyam-dashboard
  - target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: arogyam-dashboard
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: production.example.org
  - target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: arogyam-root-redirect
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: production.example.org
