# Promoted from staging, where this blackbox-exporter sidecar +
# PodMonitoring runs. Production overlays of hapi-fhir, keycloak,
# fhir-gateway and components/gmp carry the same scrape config, so both
# environments are monitored the same way.
# Requires the blackbox-exporter sidecar container + blackbox-config
# ConfigMap added to this overlay alongside this file — see
# patch-deployment.yaml and blackbox-config.yaml in this same directory.
apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: arogyam-dashboard-blackbox
  namespace: arogyam
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: arogyam-dashboard
  endpoints:
    - port: blackbox
      path: /probe
      interval: 30s
      params:
        target:
          - "http://localhost:3000/dashboard"
        module:
          - "http_2xx"
