apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: arogyam-dashboard-blackbox
  namespace: arogyam
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: arogyam-dashboard
  endpoints:
    - port: blackbox
      path: /probe
      interval: 30s
      params:
        target:
          - "http://localhost:3000/dashboard"
        module:
          - "http_2xx"
