apiVersion: v1
kind: ConfigMap
metadata:
  name: blackbox-config
  namespace: arogyam
data:
  blackbox.yml: |
    modules:
      http_2xx:
        prober: http
        timeout: 5s
        http:
          method: GET
          valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
          valid_status_codes: [200]
          preferred_ip_protocol: "ip4"
