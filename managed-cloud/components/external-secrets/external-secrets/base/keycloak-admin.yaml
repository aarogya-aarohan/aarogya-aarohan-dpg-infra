apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: keycloak-admin
  namespace: arogyam
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-sm
    kind: ClusterSecretStore
  target:
    name: keycloak-admin
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        admin-user: "{{ .username }}"
        admin-password: "{{ .password }}"
        KEYCLOAK_ADMIN_USERNAME: "{{ .username }}"
        KEYCLOAK_ADMIN_PASSWORD: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: __KEYCLOAK_ADMIN_SECRET__
        property: username
    - secretKey: password
      remoteRef:
        key: __KEYCLOAK_ADMIN_SECRET__
        property: password
