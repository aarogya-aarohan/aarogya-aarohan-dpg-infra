apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: arogyam-tenant-credentials
  namespace: arogyam
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-sm
    kind: ClusterSecretStore
  target:
    name: arogyam-tenant-credentials
    creationPolicy: Owner
  data:
    - secretKey: tenant-credentials.json
      remoteRef:
        key: aa-__ENV_SHORT__-arogyam-tenant-credentials
