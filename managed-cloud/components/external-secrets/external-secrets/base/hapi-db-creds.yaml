apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: hapi-db-creds
  namespace: arogyam
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-sm
    kind: ClusterSecretStore
  target:
    name: hapi-db-creds
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SPRING_DATASOURCE_USERNAME: "{{ .username }}"
        SPRING_DATASOURCE_PASSWORD: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: __PG_APP_CREDS_SECRET__
        property: username
    - secretKey: password
      remoteRef:
        key: __PG_APP_CREDS_SECRET__
        property: password
