apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: arogyam-dashboard-keycloak-tenants
  namespace: arogyam
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-sm
    kind: ClusterSecretStore
  target:
    name: arogyam-dashboard-keycloak-tenants
    creationPolicy: Owner
  data:
    - secretKey: KEYCLOAK_TENANTS_JSON
      remoteRef:
        key: __DASHBOARD_KEYCLOAK_TENANTS_SECRET__
