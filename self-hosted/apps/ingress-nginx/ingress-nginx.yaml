apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: ingress-nginx
spec:
  generators:
    - list:
        elements:
          - cluster: in-cluster
            name: management
            project: management
          - cluster: arogyam-example-site
            name: arogyam-example-site
            project: arogyam-production
  template:
    metadata:
      name: '{{name}}-ingress-nginx'
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: '{{project}}'
      sources:
        - chart: ingress-nginx
          repoURL: https://kubernetes.github.io/ingress-nginx
          targetRevision: 4.8.3
          helm:
            releaseName: ingress-nginx
            valueFiles:
              - '$values/self-hosted/apps/ingress-nginx/values.yaml'
        - repoURL: 'git@github.com:YOUR_ORG/aarogya-aarohan-dpg-infra.git'
          targetRevision: main
          ref: values
      destination:
        name: '{{cluster}}'
        namespace: ingress-nginx
      syncPolicy:
        automated:
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - CreateNamespace=true
          - Validate=true