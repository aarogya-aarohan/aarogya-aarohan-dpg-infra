apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-of-projects
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - path: self-hosted/projects
      repoURL: 'git@github.com:YOUR_ORG/aarogya-aarohan-dpg-infra.git'
      targetRevision: HEAD
  destination:
    name: in-cluster
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - Validate=true